services:
  tracker:
    build: .
    container_name: flight-price-tracker
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 60s
      timeout: 5s
      retries: 3
    volumes:
      - tracker-data:/srv/data

volumes:
  tracker-data:
